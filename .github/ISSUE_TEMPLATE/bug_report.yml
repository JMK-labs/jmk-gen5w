name: 문제 제보
description: JMK 패키지 사용 중 생긴 문제를 알려 주세요.
title: "[차종] 문제 요약"
body:
  - type: markdown
    attributes:
      value: |
        아래 항목을 채워 주셔야 확인할 수 있습니다. 사진이나 화면 캡처가 있으면 함께 올려 주세요.
  - type: input
    id: car_code
    attributes:
      label: 차량 코드 (8자리)
      description: 런처 메뉴 → 설정 → 업데이트 화면에 보이는 8자리 코드입니다.
      placeholder: 예) ABCD1234
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: 헤드유닛 펌웨어 버전
      description: 차량 설정의 시스템(소프트웨어) 정보 화면에 보이는 버전 전체를 적어 주세요.
      placeholder: 예) NEEV.KOR.0000.V039.001.260902
    validations:
      required: true
  - type: input
    id: car_model
    attributes:
      label: 차종 / 연식
      placeholder: 예) 아이오닉 5 2023년형
    validations:
      required: false
  - type: checkboxes
    id: apps
    attributes:
      label: 문제가 생긴 패키지
      description: 해당하는 것을 모두 체크해 주세요.
      options:
        - label: 런처 메뉴
        - label: Wi-Fi Driver (동글 / 핫스팟)
        - label: Wireless AutoPlay (무선 CarPlay / Android Auto)
        - label: HUD · 계기판 애드온 (길안내)
        - label: Active Ambient (앰비언트)
        - label: 잘 모르겠음
        - label: 기타
  - type: dropdown
    id: wifi_device
    attributes:
      label: Wi-Fi 장치
      description: 순정 모듈만 쓰면 아래 동글 칸은 비워 두세요.
      options:
        - 순정 Wi-Fi 모듈 (동글 없음)
        - USB 동글
        - 순정 모듈 + USB 동글 둘 다
        - 잘 모르겠음
    validations:
      required: true
  - type: dropdown
    id: dongle_model
    attributes:
      label: 동글 모델 (동글을 쓰는 경우)
      options:
        - 동글 안 씀
        - ipTIME A3000MINI
        - NEXT-1201AC MINI
        - ipTIME AX900 MINI
        - TP-Link Archer T3U
        - TP-Link Archer T3U Nano / Plus
        - NEXT-NX-AC1300
        - 기타 (아래에 직접 입력)
      default: 0
    validations:
      required: false
  - type: input
    id: dongle_other
    attributes:
      label: 기타 동글 모델 (직접 입력)
      placeholder: 예) 제조사와 모델명
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: 문제 내용
      description: 무엇을 했을 때 어떻게 되었는지, 언제부터인지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 추가 정보 (선택)
      description: 폰 기종, 다시 해 봤을 때의 결과, 런처 메뉴의 '기록 보내기'를 누른 시각 등
    validations:
      required: false
